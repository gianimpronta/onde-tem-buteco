name: Security scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 2" # terça-feira 07h UTC

permissions:
  contents: read
  security-events: write

jobs:
  # ── Secrets: credenciais vazadas no histórico git ─────────────────────────
  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Python SAST: vulnerabilidades comuns no código do scraper ─────────────
  bandit:
    name: SAST Python (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run bandit
        run: |
          pip install "bandit[toml]==1.8.3" "bandit-sarif-formatter==1.1.1" --quiet
          bandit -r scraper/ \
            --format sarif \
            --output bandit-results.sarif \
            --severity-level medium \
            || true

      - uses: github/codeql-action/upload-sarif@1f87aed5e66849f0c43ae147377cc77f2d98ac99 # v3
        with:
          sarif_file: bandit-results.sarif
          category: bandit

  # ── TypeScript SAST: padrões inseguros no app Next.js ────────────────────
  eslint-security:
    name: SAST TypeScript (eslint-plugin-security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.5.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run ESLint security scan
        working-directory: apps/web
        run: pnpm lint

  # ── Python: vulnerabilidades em dependências do scraper ───────────────────
  pip-audit:
    name: Dependency audit (pip)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: scraper/requirements.txt

  # ── Node.js: vulnerabilidades em dependências do app web ──────────────────
  # pnpm audit usa endpoints do npm que foram aposentados (410 Gone).
  # Substituído por osv-scanner que consulta o banco OSV do Google diretamente.
  npm-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --lockfile=apps/web/pnpm-lock.yaml
            --verbosity=error

  # ── Docker: vulnerabilidades na imagem do FlareSolverr ────────────────────
  trivy:
    name: Container scan (trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/flaresolverr/flaresolverr:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@1f87aed5e66849f0c43ae147377cc77f2d98ac99 # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-flaresolverr

  # ── Workflows: lint e segurança dos arquivos de CI ────────────────────────
  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
